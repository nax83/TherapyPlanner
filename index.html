<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TherapyPlanner</title>
  <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="app-toolbar.css">
  <link rel="stylesheet" href="patient-schedule.css">
  <link rel="stylesheet" href="clinic-weekdays-settings.css">
  <link rel="stylesheet" href="privacy-info.css">
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="translations.js"></script>
    <script src="PreferenceStore.js"></script>
    <script src="I18n.js"></script>
    <script src="TherapyPlanner.js"></script>
    <script src="PatientSchedule.js"></script>
    <script src="PatientScheduleComponent.js"></script>
    <script src="LanguageSelectorComponent.js"></script>
    <script src="ClinicWeekdaysSettingsComponent.js"></script>
    <script src="PrivacyInfoComponent.js"></script>
    <script src="AppToolbarComponent.js"></script>
    <script src="TherapyListComponent.js"></script>
  <style>
    .btn-group {
      display: block;
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <div id="first" class="col-sm">

      </div>
      <div id="second" class="col-sm">

      </div>
    </div>
  </div>
  <script>
    (async () => {
      const preferenceStorage = getSafeStorage(function getLocalStorage() {
        return window.localStorage;
      });
      const preferenceStore = createPreferenceStore({
        storage: preferenceStorage,
        storageKey: I18N_STORAGE_KEY,
      });

      const i18n = createI18n({
        translations: THERAPY_PLANNER_TRANSLATIONS,
        preferenceStore,
        navigator: window.navigator,
        document: window.document,
      });

      let config;

      if (typeof fetch === 'function') {
        try {
          const response = await fetch('config/scheduleConfig.json');
          if (response.ok) {
            config = await response.json();
            window.THERAPY_PLANNER_CONFIG = config;
          } else {
            console.warn(`Unable to load schedule configuration (status: ${response.status}). Using defaults.`);
          }
        } catch (error) {
          console.warn('Unable to load schedule configuration, using defaults.', error);
        }
      } else {
        console.warn('Fetch API not available; using default schedule configuration.');
      }

      let plannerConfig = config && typeof config === 'object'
        ? { ...config }
        : undefined;
      const storedWeekdays = preferenceStore.getValidAppointmentWeekdays();

      if (storedWeekdays) {
        plannerConfig = plannerConfig || {};
        plannerConfig.validAppointmentWeekdays = storedWeekdays.slice();
      }

      const planner = new TherapyPlanner(plannerConfig);

      // Patient appointment list component (placed in the application toolbar)
      const patientScheduleEl = createPatientScheduleComponent(planner, { i18n });
      const languageSelectorEl = createLanguageSelectorComponent(i18n);
      const clinicWeekdaysSettingsEl = createClinicWeekdaysSettingsComponent({
        planner,
        i18n,
        preferenceStore,
      });
      const privacyInfoEl = createPrivacyInfoComponent({
        i18n,
        storageKey: i18n.getStorageKey(),
      });
      const toolbarEl = createAppToolbarComponent({
        title: 'TherapyPlanner',
        i18n,
        actionElements: [patientScheduleEl, languageSelectorEl, clinicWeekdaysSettingsEl, privacyInfoEl],
      });
      document.body.insertBefore(toolbarEl, document.querySelector('.container-fluid'));

      const rightCard = createTherapyListComponent('cardRightEye', TherapyPlanner.RIGHTEYE, planner, { i18n });
      const leftCard = createTherapyListComponent('cardLeftEye', TherapyPlanner.LEFTEYE, planner, { i18n });
      document.getElementById('first').appendChild(rightCard);
      document.getElementById('second').appendChild(leftCard);
    })();
  </script>
  </body>
</html>
